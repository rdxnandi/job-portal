<header class="site-header">
  <a href="" class="brand">
    <svg 
      width="26" 
      height="26" 
      viewBox="0 0 26 26" 
      fill="none"
    >
      <path 
        d="M4 20L13 4L22 20" 
        stroke="#B9873C" 
        stroke-width="2" 
        fill="none"
      />
      <path 
        d="M4 20C4 20 8 23 13 23C18 23 22 20 22 20" stroke="#FBF9F3" 
        stroke-width="2" 
        fill="none"
      />
    </svg>
    Berth
  </a>
  <nav class="site-nav">
    <a href="">Find jobs</a>
    {% if user.is_authenticated and user.is_recruiter %}
      <a href="">Post a job</a>
    {% endif %}
  </nav>
  <div class="header-actions">
    {% if user.is_authenticated %}
      <span class="btn btn-ghost-dark" style="cursor:default;">{{ user.get_full_name|default:user.username }}</span>
      <a href="{% url 'dashboard_redirect' %}" class="btn btn-brass">Dashboard</a>
      <form method="post" action="{% url 'logout' %}" style="margin:0;">
        {% csrf_token %}
        <button type="submit" class="btn btn-ghost-dark">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-ghost-dark">Log in</a>
      <a href="{% url 'signup' %}" class="btn btn-brass">Sign up</a>
    {% endif %}
  </div>
</header>
